<div class="auth-page">
  <form class="auth-card" (ngSubmit)="entrar()">
    <div class="logo">↩ Soft<span>Devoluciones</span></div>

    <h1>Iniciar sesión</h1>
    <p class="subtitle">Ingresa para gestionar tus devoluciones.</p>

    <label for="email">Correo electrónico</label>
    <input
      id="email"
      name="email"
      type="email"
      [(ngModel)]="email"
      placeholder="correo@ejemplo.com"
      required
    >

    <label for="password">Contraseña</label>
    <input
      id="password"
      name="password"
      type="password"
      [(ngModel)]="password"
      placeholder="Tu contraseña"
      required
    >

    @if (error) {
      <div class="error">{{ error }}</div>
    }

    <button type="submit" [disabled]="cargando">
      {{ cargando ? 'Ingresando...' : 'Iniciar sesión' }}
    </button>

    <p class="footer">
      ¿No tienes una cuenta?
      <a routerLink="/register">Regístrate</a>
    </p>
  </form>
</div>
