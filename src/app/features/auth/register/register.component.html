<div class="auth-page">
  <form class="auth-card" (ngSubmit)="registrar()">
    <div class="logo">↩ Soft<span>Devoluciones</span></div>

    <h1>Crear cuenta</h1>
    <p class="subtitle">Regístrate para gestionar tus devoluciones.</p>

    <label for="nombre">Nombre completo</label>
    <input id="nombre" name="nombre" [(ngModel)]="nombre" required>

    <label for="email">Correo electrónico</label>
    <input id="email" name="email" type="email"
           [(ngModel)]="email" required>

    <label for="password">Contraseña</label>
    <input id="password" name="password" type="password"
           [(ngModel)]="password" minlength="6" required>

    <label for="confirmar">Confirmar contraseña</label>
    <input id="confirmar" name="confirmar" type="password"
           [(ngModel)]="confirmarPassword" required>

    @if (error) {
      <div class="error">{{ error }}</div>
    }

    <button type="submit" [disabled]="cargando">
      {{ cargando ? 'Registrando...' : 'Crear cuenta' }}
    </button>

    <p class="footer">
      ¿Ya tienes cuenta?
      <a routerLink="/login">Inicia sesión</a>
    </p>
  </form>
</div>
